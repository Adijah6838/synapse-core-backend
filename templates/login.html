{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2 id="form-title" style="text-align: center; margin-bottom: 1.5rem;">Login to SYNAPSE</h2>
    
    <div id="alert-box" style="display: none; padding: 10px; margin-bottom: 10px; border-radius: 5px; text-align: center;"></div>

    <form id="auth-form">
        <div class="form-group" id="email-group" style="display: none;">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">Login</button>
    </form>

    <p style="text-align: center; margin-top: 1rem; color: #94a3b8; cursor: pointer;" id="toggle-auth">
        Don't have an account? Register here.
    </p>
</div>
{% endblock %}
