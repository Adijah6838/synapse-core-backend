{% extends "base.html" %}

{% block content %}
<h2 style="margin-bottom: 2rem;">System Overview</h2>

<!-- Summary Cards -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
    <div class="card">
        <h3>Total Users</h3>
        <p id="stat-users" style="font-size: 2rem; font-weight: bold; color: #3b82f6;">-</p>
    </div>
    <div class="card">
        <h3>Documents</h3>
        <p id="stat-docs" style="font-size: 2rem; font-weight: bold; color: #10b981;">-</p>
    </div>
    <div class="card">
        <h3>Active Tasks</h3>
        <p id="stat-active-tasks" style="font-size: 2rem; font-weight: bold; color: #f59e0b;">-</p>
    </div>
    <div class="card">
        <h3>Failed Jobs</h3>
        <p id="stat-failed-jobs" style="font-size: 2rem; font-weight: bold; color: #ef4444;">-</p>
    </div>
</div>

<!-- Chart Area -->
<div class="card">
    <h3 style="margin-bottom: 1rem;">Platform Activity</h3>
    <canvas id="activityChart" height="100"></canvas>
</div>

<!-- Load the dashboard specific JS -->
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
