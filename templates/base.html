<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE - Collaboration Platform</title>
    <!-- Link to our CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Chart.js for the analytics dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="logo">SYNAPSE</div>
        <div class="nav-links" id="nav-links">
            <!-- These buttons will show/hide based on login state -->
            <button id="btn-dashboard" class="nav-btn">Dashboard</button>
            <button id="btn-logout" class="nav-btn danger">Logout</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container">
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock %}
    </main>

    <!-- Load our JavaScript file -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
